name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy

      # The suite generates a small order history in memory; no network, model server or key.
      - name: tests
        run: uv run pytest -q

      - name: end-to-end run at full scale
        run: |
          uv run python scripts/generate_data.py
          uv run order-margin --out ci-outputs
          cat ci-outputs/report.md
