[project]
name = "order-outcome-margin"
version = "0.1.0"
description = "Per-order outcome probabilities turned into expected contribution margin, and a COD policy scored on margin against orders lost"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "lightgbm>=4.6",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
order-margin = "order_margin.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_margin"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# X and P follow the usual matrix notation for features and probability matrices.
"src/order_margin/*.py" = ["N803", "N806"]
"tests/*.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
