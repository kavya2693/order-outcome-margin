     check: {expr: "J('outputs/results.json')['orders_total']", fmt: "{:,d}", expect: "341,880"}}
  - {id: F-04, slides: ["02", "05"], label: "History length", shown: "2 years / 2024–2025", type: direct, source: "src/order_margin/config.py:70-71", key: "DATA_START, DATA_END", formula: "-",
     check: {expr: "grep('src/order_margin/config.py', r'DATA_START = \"2024-01-01\"') and grep('src/order_margin/config.py', r'DATA_END = \"2025-12-31\"')", fmt: bool}}
