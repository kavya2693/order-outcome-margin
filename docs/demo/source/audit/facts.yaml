  - {id: F-01, slides: ["01"], label: "Who relates: online marketplaces, cash-on-delivery e-commerce, finance & checkout ops teams", shown: "3 chips", type: general-knowledge, source: "author's framing; README 'The problem' (finance and operations teams)", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (refused COD parcels; returns/cancels/chargebacks; flat-average margin plans; gut-rule COD switch-off)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem'", key: "README lines 12-25", formula: "-",
     check: {expr: "grep('README.md', r'refuses the parcel') and grep('README.md', r\"last quarter's average\") and grep('README.md', r'hide the COD option') and grep('README.md', r'disputes')", fmt: bool}}
