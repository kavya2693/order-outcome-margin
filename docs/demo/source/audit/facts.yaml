# Audit facts for the order-outcome-margin demo video.
# Read by docs/demo/source/tools/build_audit_report.py (paths below are relative to this file).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: order-outcome-margin
  title: "order-outcome-margin: demo video audit report"
  repo_url: https://github.com/kavya2693/order-outcome-margin
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 88.4
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [lightgbm, sklearn, pandas, numpy]
  regenerate:
    - "make run                                   # data/, outputs/*.csv, results.json, report.md, *.png (about 2 min)"
    - "python3 docs/demo/source/tools/export_run.py outputs docs/demo/source/assets/run.json"
    - "python3 docs/demo/source/tools/inject_block.py docs/demo/source/assets/run.json docs/demo/source/compositions/s04-routes.html --block RUN --keys daily,frontier,points"
    - "python3 docs/demo/source/tools/make_end_plot.py outputs docs/demo/source/assets/end-frontier.png"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_cod_sheet.py docs/demo/source/assets/cod_sheet.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/cod_sheet.json docs/demo/source/compositions/value.html --rows 315400,316055,316096,316229,315744,316309 --animate 315400,316096,316229,315744"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/order-outcome-margin-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/order-outcome-margin-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 20260913, lightgbm_seed: 7, bootstrap_seed: 0}
  run_time: "results.json runtime_seconds = 72.8 s for the pipeline (make run also generates the data first; README says about 2 minutes on a laptop)"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (341,880 orders over 2024-2025, six zones, five categories, COD about 48%). The production data is proprietary."
    source: "src/order_margin/config.py:78 (SEED = 20260913); src/order_margin/generate.py; README 'The data'"
    all_figures: true
    figures: []
    edit: ["src/order_margin/generate.py", "src/order_margin/world.py"]
    rerun: ["make data", "make run"]
  - id: A-02
    statement: "Card conversion: 40% of blocked customers younger than 30 days and 60% of the rest switch to a card. It is an input, not measured; with decisions fixed, 20 points lower conversion breaks even (+944) and 30 points lower loses 9,714."
    source: "src/order_margin/config.py:75-76 (COD_TO_CARD_CONVERSION, NEW_CUSTOMER_DAYS); outputs/conversion_sensitivity.csv; README 'Known limitations' (biggest gap)"
    figures: [F-13, F-14, F-21, F-32, F-33, F-34, F-39, F-40, F-41, F-44, F-45, F-46, F-47, F-54, F-55]
    edit: ["src/order_margin/config.py:75"]
    rerun: ["make run", "export_cod_sheet.py + inject_sheet.py"]
  - id: A-03
    statement: "Unit economics are one table per category (gross margin, resale loss, shipping legs, COD/card/wallet fees, a 45 chargeback fee). Real courier rates vary by weight and contract."
    source: "src/order_margin/config.py:22-60 (Economics); src/order_margin/economics.py:36-71"
    figures: [F-13, F-14, F-28, F-29, F-30, F-32, F-40, F-41, F-44, F-45, F-46, F-47, F-55]
    edit: ["src/order_margin/config.py:22-60"]
    rerun: ["make run", "export_cod_sheet.py + inject_sheet.py"]
  - id: A-04
    statement: "Time split: train 2024-01-01..2025-02-28, early stopping 2025-03..04, calibration 2025-05..08, test 2025-09-01..12-31 (73,024 orders, 122 days)."
    source: "src/order_margin/config.py:67-71; pipeline.py:64-71 (split_masks)"
    figures: [F-20, F-23, F-25, F-27, F-28, F-29, F-35, F-48, F-49, F-50, F-51, F-52, F-53]
    edit: ["src/order_margin/config.py:67-71"]
    rerun: ["make run"]
  - id: A-05
    statement: "Outcomes are known 14 days after the order; customer history features only use orders placed at least 14 days earlier, shrunk towards fixed long-run rates."
    source: "src/order_margin/features.py:15-19 (RESOLVE_DAYS, PRIOR_STRENGTH, POPULATION_RATE)"
    figures: [F-17]
    edit: ["src/order_margin/features.py:15"]
    rerun: ["make run"]
  - id: A-06
    statement: "COD policies are scored on the generator's true outcome probabilities under COD and under card (data/truth/order_truth.csv.gz), never on the model that made the decision. The card version of an order is the same order with the payment feature switched."
    source: "src/order_margin/pipeline.py:186-201 (counterfactual), :236-245 (score_policy); features.py:with_payment; README 'How it works'"
    figures: [F-13, F-14, F-32, F-40, F-44, F-45, F-46, F-47, F-55]
    edit: ["src/order_margin/pipeline.py"]
    rerun: ["make run"]
  - id: A-07
    statement: "LightGBM settings: multiclass, learning rate 0.03, 15 leaves, seed 7, early stopping with 100-round patience on the March-April 2025 window (stopped at 186 rounds); chosen from four settings, never on the test window."
    source: "src/order_margin/models.py:71-108; README 'How it works'"
    figures: [F-18, F-19, F-48, F-49, F-50, F-51, F-52, F-53]
    edit: ["src/order_margin/models.py:71-89"]
    rerun: ["make run"]
  - id: A-08
    statement: "One seed and one test window. The bootstrap interval (1,000 order resamples) covers which orders arrived, not a different year or fraud pattern."
    source: "src/order_margin/pipeline.py:268-275; README 'Known limitations'"
    figures: [F-46, F-47]
    edit: ["src/order_margin/config.py:78"]
    rerun: ["make data", "make run"]
  - id: A-09
    statement: "'Sale days' = days flagged is_peak: the November sale week (2025-11-21..29) plus 11.11. Slide 06 shades all ten of them (label 'SALE DAYS (shaded)')."
    source: "src/order_margin/generate.py:30-31 (SALE_WEEKS, SINGLES_DAY); pipeline.py:74-85 (_daily_errors)"
    figures: [F-28, F-29, F-37, F-26]
    edit: ["src/order_margin/generate.py:30-31"]
    rerun: ["make data", "make run"]
  - id: A-10
    statement: "Video rounding: margins to whole units with thousands separators, percentages to 1 decimal (63%, 48% and 64% to whole numbers), predicted/actual count ratios to 2 decimals; chart axes in thousands ('+20k'); '~470 a day' and 'about 2 min' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-05, F-07, F-09, F-22, F-28, F-29, F-34, F-44, F-48, F-49, F-50, F-51, F-52, F-53, F-54, F-58]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-11
    statement: "Slide 01 (industry, everyday problems) is general e-commerce knowledge used as context, matched to the README problem statement. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem'"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]
  - id: A-12
    statement: "The shipped model is the plain (unweighted) LightGBM with an isotonic calibrator fitted on May-Aug 2025, a window the booster never trained or early-stopped on. The COD rule and the reported daily forecast use it; the class-weighted LightGBM is fitted only as a comparison, and a test requires that weighting breaks the margin forecast."
    source: "src/order_margin/models.py:71 (class_weighted: bool = False); pipeline.py:122 (isotonic fitted on the calibration window), :180 (daily forecast columns), :203 (g_iso = gain_hat(gbm, iso['gbm'])), :205 and :229 (weighted model as a scored comparison), :252 (block_iso); tests/test_pipeline.py:24"
    figures: [F-48, F-49, F-50, F-51, F-52, F-53, F-54, F-55, F-61]
    edit: ["src/order_margin/pipeline.py:203", "src/order_margin/models.py:71"]
    rerun: ["make run"]

figures:
