      - "Legend: data store · config · decision · human input · compared, not shipped · batch flow · 2nd pass, as card · scoring only"
      - "CRITICAL PATH order rows → features → LightGBM → isotonic → E[margin] → gain > 0 ? → checkout"
    assumptions: [A-01, A-02, A-04, A-05, A-06, A-07]
    illustrative: ["Packets moving along the wires show execution order, not timing.", "'Finance' and 'Checkout' are the consumers the README names (finance close, checkout COD option); the repo writes files, it does not call a checkout service.", "'offline batch' describes how the repo runs (one CLI run over files); no serving latency is measured, so none is shown."]
