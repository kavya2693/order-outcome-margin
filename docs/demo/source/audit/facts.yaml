     check: {expr: "len(_re.search(r'CLASSES: tuple\\[str, \\.\\.\\.\\] = \\((.*)\\)', T('src/order_margin/config.py')).group(1).split(','))", fmt: "{:d}", expect: "5"}}
  - {id: F-07, slides: ["02"], label: "Orders per day", shown: "~470 orders a day", type: derived, source: "data/orders.csv.gz", key: "orders / distinct order days", formula: "341,880 / 731 = 467.7, rounded to tens (README: 'around 470 orders a day')",
     check: {expr: "round(len(R('data/orders.csv.gz')) / R('data/orders.csv.gz')['order_ts'].str[:10].nunique(), -1)", fmt: "~{:.0f}", expect: "~470"}}
