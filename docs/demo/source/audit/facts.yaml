  import ast as _ast
  import re as _re
  def n_features():
      """len(NUMERIC) + len(CATEGORICAL) parsed from features.py."""
      tree = _ast.parse(T('src/order_margin/features.py'))
      n = 0
      for node in tree.body:
          if isinstance(node, _ast.Assign) and getattr(node.targets[0], 'id', '') in ('NUMERIC', 'CATEGORICAL'):
              n += len(node.value.elts)
      return n
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported sheet for the six chosen orders."""
      html = T('demo:compositions/value.html')
      m = _re.search(r"const SHEET = (\{.*?\}); /\* SHEET:END", html, _re.S)
      sheet = json.loads(m.group(1))
      src = {r['order_id']: r for r in J('demo:assets/cod_sheet.json')['rows']}
      for r in sheet['rows']:
          s = src[r['order_id']]
          for k in ('zone', 'category', 'basket', 'p_refuse', 'em_cod', 'em_card', 'gain', 'block'):
              if r[k] != s[k]:
                  return False
          if (r['gain'] > 0) != r['block'] or abs(r['conv'] * r['em_card'] - r['em_cod'] - r['gain']) > 0.15:
              return False
      return [r['order_id'] for r in sheet['rows']] == [315400, 316055, 316096, 316229, 315744, 316309]
  def run_block_matches():
      """The RUN block injected in s04-routes.html must equal the repo CSVs (daily margin, frontier, policy points)."""
      html = T('demo:compositions/s04-routes.html')
      m = _re.search(r"const RUN = (\{.*?\}); /\* RUN:END", html, _re.S)
      run = json.loads(m.group(1))
      d = R('outputs/daily_margin.csv')
      cols = ['realized', 'class priors', 'gbm + isotonic', 'gbm class-weighted, raw']
      want = [[int(r['peak'])] + [round(float(r[c])) for c in cols] for _, r in d.iterrows()]
      if run['daily'] != want or len(want) != 122 or sum(r[0] for r in want) != 10:
          return False
      fr = R('outputs/policy_frontier.csv')
      for name, pts in run['frontier'].items():
          g = fr[fr['ranking'] == name]
          if pts != [[round(float(a), 1), round(float(b))] for a, b in zip(g['orders_lost'], g['margin_change'])]:
              return False
      pol = R('outputs/policy.csv').set_index('policy')
      risk = [p for p in pol.index if p.startswith('risk score')][0]
      names = {'margin_rule': 'margin rule, gbm + isotonic', 'rule_of_thumb': 'rule of thumb: new customer and basket > 300', 'block_all': 'block every COD order', 'risk_score': risk}
      return all(run['points'][k] == [round(float(pol.loc[v, 'orders_lost']), 1), round(float(pol.loc[v, 'margin_change']))] for k, v in names.items())
  def twist_bars_match():
      """Slide 09 bars: predicted/actual count ratio on one scale, the class-weighted fraud ratio = 260 px."""
      html = T('demo:compositions/s06-twist.html')
      w = [int(x) for x in _re.findall(r'id="twist-[lr]b\d" style="width: (\d+)px"', html)]
      m = R('outputs/metrics.csv').set_index('model')
      top = m.loc['gbm class-weighted, raw', 'count_ratio_fraud']
      want = [round(m.loc[k, c] / top * 260) for k in ('gbm class-weighted, raw', 'gbm + isotonic') for c in ('count_ratio_fraud', 'count_ratio_failed', 'count_ratio_returned')]
      return w == want
  def fix_in_code():
      """Slide 09's fix exists in the code: plain booster default, isotonic on the calibration window, COD rule on gbm + isotonic, weighted model only a comparison, and a test that pins it."""
      models, pipe, test = T('src/order_margin/models.py'), T('src/order_margin/pipeline.py'), T('tests/test_pipeline.py')
      return all([
          'class_weighted: bool = False' in models,
          'iso = {k: IsotonicCalibrator().fit(v, yc) for k, v in raw_c.items()}' in pipe,
          'g_iso = gain_hat(gbm, iso["gbm"])' in pipe,
          'block_iso = g_iso > 0' in pipe,
          '("margin rule, class-weighted gbm", g_w > 0)' in pipe,
          '"gbm + isotonic", "gbm class-weighted, raw"' in pipe,
          'def test_class_weighting_breaks_the_margin_forecast_and_isotonic_repairs_it' in test,
      ])
