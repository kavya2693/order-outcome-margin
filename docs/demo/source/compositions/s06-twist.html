<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #twist-root { position: absolute; inset: 0; }
        #twist-root .eyebrow { color: var(--c-risk); }
        #twist-root .sub { position: absolute; left: 120px; top: 200px; font-size: 32px; color: var(--ink-soft); }
        #twist-root .bars { position: absolute; left: 120px; top: 290px; width: 1680px; }
        #twist-root .row { display: flex; align-items: center; height: 92px; }
        #twist-root .who { width: 470px; font-size: 36px; font-weight: 700; color: var(--ink); }
        #twist-root .who small { display: block; font-family: var(--mono); font-size: 22px; font-weight: 400; color: var(--ink-mute); }
        #twist-root .track { position: relative; width: 1000px; height: 44px; border-radius: 8px; background: rgba(178, 191, 204, 0.08); }
        #twist-root .fill { position: absolute; left: 0; top: 0; height: 44px; border-radius: 8px; background: var(--ink-mute); transform-origin: left center; }
        #twist-root .val { width: 210px; text-align: right; font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--ink-soft); }
        #twist-root .rule .fill { background: var(--c-eval); }
        #twist-root .rule .val { color: var(--c-eval); }
        #twist-root .xgb .fill { background: var(--c-model); }
        #twist-root .xgb .val { color: var(--c-model); }
        #twist-root .lr .fill { background: rgba(185, 162, 255, 0.55); }
        #twist-root .verdict {
          position: absolute; left: 120px; top: 772px; width: 1680px; padding: 22px 28px; border-radius: 12px;
          border: 2px solid rgba(255, 138, 115, 0.45); background: rgba(255, 138, 115, 0.07);
          font-size: 30px; line-height: 1.4; color: var(--ink);
        }
        #twist-root .verdict b { color: var(--c-risk); }
      </style>
      <div id="twist-root" data-composition-id="twist" data-width="1920" data-height="1080">
        <div class="scene" id="twist-in">
          <div class="eyebrow" data-layout-allow-overlap id="twist-eyebrow">09 · What didn't win</div>
          <div class="scene-title" data-layout-allow-overlap id="twist-title">Boosting barely beat a logistic regression.</div>
          <div class="sub" id="twist-sub">Log-loss on 73,024 test orders, drawn as the gain over flat class rates (longer is better)</div>
          <div class="bars">
            <div class="row" id="twist-r1"><div class="who">Flat class rates<small>finance's averages</small></div>
              <div class="track"><div class="fill" id="twist-b1" style="width: 6px"></div></div><div class="val">0.7442</div></div>
            <div class="row lr" id="twist-r2"><div class="who">Logistic regression<small>raw · macro-F1 0.290</small></div>
              <div class="track"><div class="fill" id="twist-b2" style="width: 767px"></div></div><div class="val">0.6475</div></div>
            <div class="row xgb" id="twist-r3"><div class="who">LightGBM<small>raw · macro-F1 0.294</small></div>
              <div class="track"><div class="fill" id="twist-b3" style="width: 772px"></div></div><div class="val">0.6469</div></div>
            <div class="row xgb" id="twist-r4"><div class="who">LightGBM + isotonic<small>ECE 0.0027 → 0.0035</small></div>
              <div class="track"><div class="fill" id="twist-b4" style="width: 764px"></div></div><div class="val">0.6478</div></div>
            <div class="row rule" id="twist-r5"><div class="who">True probabilities<small>ceiling</small></div>
              <div class="track"><div class="fill" id="twist-b5" style="width: 1000px"></div></div><div class="val">0.6181</div></div>
          </div>
          <div class="verdict" id="twist-verdict"><b>Why:</b> outcomes here are close to additive in log-odds, the shape logistic regression assumes. Isotonic only earned its place repairing class weighting (ECE 0.206 → 0.009).</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 6.6;
          tl.fromTo("#twist-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#twist-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#twist-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#twist-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          [1, 2, 3, 4, 5].forEach((n, i) => {
            tl.fromTo("#twist-r" + n, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.8 + i * 0.15);
            tl.fromTo("#twist-b" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 1.0 + i * 0.15);
          });
          tl.fromTo("#twist-verdict", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.6);
          tl.to("#twist-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["twist"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
