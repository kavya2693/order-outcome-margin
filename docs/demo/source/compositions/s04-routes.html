          el("rect", { x: BX0, y: BY0, width: BX1 - BX0, height: BY1 - BY0 }, cp);
          const curves = [
            ["margin gain, true probabilities", "#c8d3de", 3, "8 7"],
            ["risk score, gbm + isotonic", "#ff8a73", 3.5, null],
            ["margin gain, gbm + isotonic", "#3fd8a8", 4, null],
          ];
          const gB = el("g", { "clip-path": "url(#routes-clip)" }, B);
          const lineB = curves.map(([name, col, w, dash], j) => {
            const d = RUN.frontier[name].map((p, i) => (i ? "L" : "M") + bx(p[0]).toFixed(1) + " " + by(p[1]).toFixed(1)).join("");
            const g = el("g", { id: "routes-lb" + j, opacity: 0 }, gB);
            const a = { d, fill: "none", stroke: col, "stroke-width": w, "stroke-linejoin": "round" };
            if (dash) a["stroke-dasharray"] = dash;
            el("path", a, g);
            return g;
          });
          const P = RUN.points;
          const dots = [
            ["margin_rule", "#3fd8a8", "margin rule", -24, -6, "end"],
            ["risk_score", "#ff8a73", "risk score", -20, 38, "end"],
            ["rule_of_thumb", "#c8d3de", "rule of thumb", 0, 44, "middle"],
          ].map(([key, col, label, dx, dy, anchor], j) => {
            const g = el("g", { id: "routes-dot" + j, opacity: 0 }, B);
            const [x, y] = P[key];
            el("circle", { cx: bx(x), cy: by(y), r: 9, fill: col, stroke: "#0a1119", "stroke-width": 3 }, g);
            txt(g, bx(x) + dx, by(y) + dy, label, "ptl", anchor, col);
            return g;
          });

          const P2 = 7.2;
          tl.to("#routes-a", { opacity: 0, duration: 0.4, ease: "power2.in" }, P2 - 0.4);
          tl.fromTo("#routes-b", { opacity: 0 }, { opacity: 1, duration: 0.01 }, P2);
          tl.fromTo("#routes-title-b", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, P2 + 0.05);
          tl.fromTo("#routes-sub-b", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.3);
          tl.fromTo("#routes-axes-b", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.3);
          lineB.forEach((g, j) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.6 }, P2 + 0.6 + j * 0.35));
          dots.forEach((g, j) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, P2 + 1.9 + j * 0.25));
          tl.fromTo("#routes-lg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.5);
          const fmt = (v) => (v >= 0 ? "+" : "−") + Math.abs(Math.round(v)).toLocaleString("en-US");
          [[P.margin_rule[1], "#routes-v1"], [P.risk_score[1], "#routes-v2"], [P.block_all[1], "#routes-v3"]].forEach(([v, sel], i) => {
            const at = P2 + 1.0 + i * 0.45;
            tl.fromTo("#routes-p" + (i + 1), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at);
            const o = { v: 0 }, e = document.querySelector(sel);
            tl.to(o, { v, duration: 1.4, ease: "power3.out", onUpdate: () => { e.textContent = fmt(o.v); } }, at + 0.2);
          });
          tl.fromTo("#routes-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 2.8);
          tl.to("#routes-p1", { boxShadow: "0 0 50px rgba(63,216,168,0.35)", duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, P2 + 3.6);
          tl.to("#routes-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.8); // dip: fully out before the next scene starts
          window.__timelines["routes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
