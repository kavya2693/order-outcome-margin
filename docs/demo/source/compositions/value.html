<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* WHITE "END-USER VALUE" SLIDE: the artifact the user plans with (left) + a small 2D scene of the
           person using it (right). Data is inlined by tools/inject_sheet.py between the SHEET markers. */
        #value-root {
          position: absolute; inset: 0;
          --w-bg: #ffffff; --w-ink: #111827; --w-soft: #4b5563; --w-mute: #4b5563; --w-line: #d1d5db; --w-faint: #f3f4f6;
          --w-data: #d97706; --w-model: #6d3cf0; --w-tools: #1f8fa8; --w-risk: #dc2b4a; --w-opt: #0f9f6e;
          color: var(--w-ink); font-family: Inter, "Helvetica Neue", sans-serif;
        }
        #value-root .page { position: absolute; inset: 0; background: var(--w-bg); }
        #value-root .edge { position: absolute; top: 0; width: 10px; height: 1080px; background: var(--w-model); }
        #value-root .kick {
          position: absolute; left: 120px; top: 84px; font-family: "JetBrains Mono", monospace; font-size: 24px;
          font-weight: 700; letter-spacing: 0.18em; color: var(--w-mute);
        }
        #value-root .ttl {
          position: absolute; left: 120px; top: 124px; font-family: Montserrat, sans-serif; font-weight: 900;
          font-size: 68px; letter-spacing: -0.02em; white-space: nowrap;
        }
        #value-root .ttl em { font-style: normal; color: var(--w-model); }
        #value-root .uline { position: absolute; left: 124px; top: 222px; width: 120px; height: 10px; border-radius: 5px; background: var(--w-model); transform-origin: left center; }

        /* sheet */
        #value-root .sheet {
          position: absolute; left: 120px; top: 300px; width: 1084px; height: 620px; border: 3px solid var(--w-line);
          border-radius: 24px; background: #fff; box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08); overflow: hidden;
        }
        #value-root .sheet-head {
          height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
          background: var(--w-ink); color: #fff; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
        }
        #value-root .sheet-head span:last-child { color: #c4b5fd; }
        #value-root .row {
          position: relative; display: flex; align-items: center; height: 60px; padding: 0 20px;
          font-family: "JetBrains Mono", monospace; font-size: 22px; color: var(--w-ink); border-bottom: 2px solid var(--w-faint);
        }
        #value-root .row.hdr { height: 54px; font-weight: 700; letter-spacing: 0.02em; color: var(--w-mute); background: #fafafa; }
        #value-root .row .tint { position: absolute; inset: 0; opacity: 0; }
        #value-root .c { position: relative; white-space: nowrap; flex: 0 0 auto; }
        #value-root .c1 { width: 104px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
        #value-root .c1 i { display: block; width: 12px; height: 12px; border-radius: 3px; background: var(--w-line); flex: 0 0 auto; }
        #value-root .c2 { width: 180px; padding-left: 6px; }
        #value-root .c3 { width: 158px; }
        #value-root .c4, #value-root .c5, #value-root .c6, #value-root .c7, #value-root .c8 { text-align: right; padding-right: 14px; }
        #value-root .c4 { width: 93px; }
        #value-root .c5 { width: 93px; }
        #value-root .c6 { width: 93px; }
        #value-root .c7 { width: 106px; }
        #value-root .c8 { width: 82px; font-weight: 700; }
        #value-root .c9 { width: 126px; padding-left: 4px; }
        #value-root .act { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 22px; font-weight: 700; color: #fff; }
        #value-root .act.hide { background: #0e7490; }
        #value-root .act.keep { background: #b45309; }
        #value-root .pos { color: #047857; }
        #value-root .neg { color: var(--w-mute); }
        #value-root .more { padding: 12px 30px 0; font-family: "JetBrains Mono", monospace; font-size: 22px; color: var(--w-mute); }
        #value-root .totals {
          position: absolute; left: 0; bottom: 0; width: 100%; height: 66px; display: flex; align-items: center; gap: 14px; padding: 0 30px;
          background: #ecfdf5; border-top: 2px solid #a7f3d0; font-size: 23px; font-weight: 700; color: #065f46; white-space: nowrap;
        }
        #value-root .totals b { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--w-opt); position: relative; flex: 0 0 auto; }
        #value-root .totals svg { position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; }

        /* scene */
        #value-root .scene-lab { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; color: var(--w-mute); white-space: nowrap; }
        #value-root .subt { position: absolute; left: 120px; top: 248px; width: 1680px; font-size: 26px; font-weight: 500; color: var(--w-soft); }
        #value-root .subt b { color: var(--w-ink); }
        #value-root .desk { position: absolute; left: 1240px; top: 332px; width: 580px; height: 120px; border-radius: 20px; background: var(--w-faint); }
        #value-root .floor {
          position: absolute; left: 1240px; top: 472px; width: 580px; height: 448px; border-radius: 24px; border: 3px solid var(--w-line);
          background-color: #fbfbfc;
        }
        #value-root svg.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #value-root .meter {
          position: absolute; left: 1262px; top: 848px; width: 536px; height: 62px; border-radius: 16px; background: #ecfdf5;
          border: 2px solid #a7f3d0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
        }
        #value-root .meter .ml { font-family: "JetBrains Mono", monospace; font-size: 22px; color: #065f46; line-height: 1.1; white-space: nowrap; }
        #value-root .meter .mv { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 700; color: #047857; }
        #value-root .caption {
          position: absolute; left: 120px; top: 944px; width: 1700px; font-size: 30px; font-weight: 700; color: var(--w-ink);
        }
        #value-root .caption span { color: var(--w-model); }
      </style>

      <div id="value-root" data-composition-id="value" data-width="1920" data-height="1080">
        <div class="page" id="va-page">
          <div class="kick" id="va-kick">07 · END-USER VALUE</div>
          <div class="ttl" id="va-ttl">What the <em>checkout ops lead</em> gets</div>
          <div class="uline" id="va-ul"></div>
          <div class="subt" id="va-sub">Each row is one cash order on a sale-week day. <b>GAIN</b> = card margin × switch rate − COD margin; above 0 means hide COD.</div>

          <div class="sheet" id="va-sheet">
            <div class="sheet-head"><span id="va-head-l">COD DECISIONS · SALE WEEK</span><span id="va-head-r"></span></div>
            <div class="row hdr" id="va-hdr">
              <div class="c c1">ORDER</div><div class="c c2">ZONE</div><div class="c c3">CATEGORY</div>
              <div class="c c4">BASKET</div><div class="c c5">REFUSE</div><div class="c c6">IF COD</div>
              <div class="c c7">IF CARD</div><div class="c c8">GAIN</div><div class="c c9">ACTION</div>
            </div>
            <div id="va-rows"></div>
            <div class="more" id="va-more"></div>
            <div class="totals" id="va-totals"></div>
          </div>

          <div class="scene-lab" id="va-lab-desk" style="left: 1240px; top: 300px">OPS LEAD · CHECKOUT RULES</div>
          <div class="desk" id="va-desk"></div>
          <div class="floor" id="va-floor"></div>
          <div class="scene-lab" id="va-lab-floor" style="left: 1262px; top: 486px">CUSTOMERS AT CHECKOUT</div>
          <svg class="layer" id="va-svg" viewBox="0 0 1920 1080"></svg>
          <div class="meter" id="va-meter">
            <div class="ml"><div>margin today vs</div><div>COD for everyone</div></div>
            <div class="mv" id="va-meter-v">+0</div>
          </div>

          <div class="caption" id="va-caption">COD goes off only where a card order earns more. <span>Risky but profitable orders keep cash.</span></div>
        </div>
        <div class="edge" id="va-edge"></div>
      </div>

      <script>
        (() => {
          /* SHEET:BEGIN */ const SHEET = {"day":"2025-11-24","orders":1273,"cod_orders":609,"blocked":102,"kept":507,"expected_orders_lost":41.4,"day_true_gain":602.0,"rows":[{"order_id":315400,"zone":"remote_south","category":"home","basket":1824.0,"p_refuse":0.465,"conv":0.6,"em_cod":127.3,"em_card":294.6,"gain":49.5,"block":true,"animate":0},{"order_id":316055,"zone":"remote_north","category":"grocery","basket":859.0,"p_refuse":0.463,"conv":0.6,"em_cod":25.0,"em_card":80.3,"gain":23.2,"block":true,"animate":-1},{"order_id":316096,"zone":"remote_north","category":"electronics","basket":984.0,"p_refuse":0.406,"conv":0.6,"em_cod":13.4,"em_card":20.2,"gain":-1.3,"block":false,"animate":1},{"order_id":316229,"zone":"remote_north","category":"electronics","basket":670.0,"p_refuse":0.544,"conv":0.6,"em_cod":-12.0,"em_card":2.8,"gain":13.7,"block":true,"animate":2},{"order_id":315744,"zone":"remote_south","category":"home","basket":814.0,"p_refuse":0.288,"conv":0.6,"em_cod":92.7,"em_card":140.8,"gain":-8.3,"block":false,"animate":3},{"order_id":316309,"zone":"remote_south","category":"beauty","basket":233.0,"p_refuse":0.425,"conv":0.6,"em_cod":5.5,"em_card":33.6,"gain":14.7,"block":true,"animate":-1}]}; /* SHEET:END */

          const CONFIG = {
            duration: 13.0,
            colors: ["#6d3cf0", "#b45309", "#0e7490", "#2563eb"], // one per animated checkout
            phoneX: [1258, 1398, 1538, 1678],
            phoneY: 532,
            phone: { w: 128, h: 268 },
            person: { x: 1306, y: 400 },
          };
          const NS = "http://www.w3.org/2000/svg";
          const svg = document.getElementById("va-svg");
          const el = (tag, attrs, parent) => {
            const n = document.createElementNS(NS, tag);
            Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
            (parent || svg).appendChild(n);
            return n;
          };
          const txt = (s, attrs, parent) => {
            const t = el("text", Object.assign({ "font-family": "JetBrains Mono, monospace", "font-size": 22, "font-weight": 700, "text-anchor": "middle" }, attrs), parent);
            t.textContent = s;
            return t;
          };
          const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
          const fmt = (v) => Math.round(v).toLocaleString("en-US");
          const sgn = (v, d) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
          const tl = gsap.timeline({ paused: true });
          const D = CONFIG.duration;

          // ---------------- sheet ----------------
          document.getElementById("va-head-r").textContent = SHEET.day;
          const rowsEl = document.getElementById("va-rows");
          SHEET.rows.forEach((r, i) => {
            const col = r.animate >= 0 ? CONFIG.colors[r.animate] : "#d1d5db";
            rowsEl.insertAdjacentHTML("beforeend",
              '<div class="row" id="va-r' + i + '"><div class="tint" id="va-t' + i + '" style="background:' + col + '22"></div>' +
              '<div class="c c1"><i style="background:' + col + '"></i>' + r.order_id + "</div>" +
              '<div class="c c2">' + r.zone + '</div><div class="c c3">' + r.category + "</div>" +
              '<div class="c c4">' + fmt(r.basket) + '</div><div class="c c5">' + Math.round(r.p_refuse * 100) + "%</div>" +
              '<div class="c c6">' + fmt(r.em_cod) + '</div><div class="c c7">' + fmt(r.em_card) + "</div>" +
              '<div class="c c8 ' + (r.gain > 0 ? "pos" : "neg") + '">' + sgn(r.gain, 1) + "</div>" +
              '<div class="c c9"><span class="act ' + (r.block ? "hide" : "keep") + '">' + (r.block ? "HIDE COD" : "KEEP COD") + "</span></div></div>");
          });
          document.getElementById("va-more").textContent =
            "+ " + (SHEET.cod_orders - SHEET.rows.length) + " more COD orders · gain = switch rate × IF CARD − IF COD";
          document.getElementById("va-totals").innerHTML =
            "<b>" + CHECK + "</b>" + SHEET.blocked + " of " + SHEET.cod_orders + " COD orders hide COD · " + SHEET.kept + " keep it · +" + fmt(SHEET.day_true_gain) + " margin that day";

          // ---------------- scene: person at a laptop, four checkouts ----------------
          const P = CONFIG.person;
          const person = el("g", { id: "va-person" });
          el("circle", { cx: P.x, cy: P.y - 34, r: 16, fill: "#111827" }, person);
          el("path", { d: "M" + (P.x - 26) + " " + (P.y + 40) + "v-26a26 22 0 0 1 52 0v26z", fill: "#6d3cf0" }, person);
          const laptop = el("g", { id: "va-laptop" });
          el("rect", { x: P.x + 50, y: P.y - 26, width: 120, height: 74, rx: 6, fill: "#111827" }, laptop);
          el("rect", { x: P.x + 56, y: P.y - 20, width: 108, height: 60, rx: 3, fill: "#fff" }, laptop);
          [0, 1, 2, 3].forEach((k) => el("rect", { x: P.x + 62, y: P.y - 13 + k * 13, width: k % 2 ? 60 : 90, height: 6, rx: 3, fill: k === 1 ? "#1f8fa8" : "#d1d5db" }, laptop));
          el("rect", { x: P.x + 38, y: P.y + 48, width: 144, height: 8, rx: 4, fill: "#111827" }, laptop);

          const animRows = SHEET.rows.map((r, i) => ({ r, i })).filter((o) => o.r.animate >= 0).sort((a, b) => a.r.animate - b.r.animate);
          const PW = CONFIG.phone.w, PH = CONFIG.phone.h, PY = CONFIG.phoneY;
          const LOAD0 = 3.6, DECIDE0 = 6.0;
          animRows.forEach(({ r, i }, ti) => {
            const col = CONFIG.colors[ti], x = CONFIG.phoneX[ti];
            const ph = el("g", { id: "va-ph" + ti });
            el("rect", { x, y: PY, width: PW, height: PH, rx: 18, fill: "#111827" }, ph);
            el("rect", { x: x + 7, y: PY + 16, width: PW - 14, height: PH - 32, rx: 8, fill: "#fff" }, ph);
            el("rect", { x: x + 7, y: PY + 16, width: PW - 14, height: 34, rx: 8, fill: col }, ph);
            txt(String(r.order_id), { x: x + PW / 2, y: PY + 40, fill: "#fff" }, ph);
            txt(fmt(r.basket), { x: x + PW / 2, y: PY + 78, fill: "#4b5563", "font-weight": 400 }, ph);
            txt("PAY", { x: x + PW / 2, y: PY + 112, fill: "#4b5563" }, ph);
            // payment buttons: neutral first, then the decision
            const bx = x + 16, bw = PW - 32;
            const cod = el("rect", { x: bx, y: PY + 124, width: bw, height: 40, rx: 8, fill: "#fff", stroke: "#9ca3af", "stroke-width": 2 }, ph);
            const codT = txt("COD", { x: x + PW / 2, y: PY + 151, fill: "#111827" }, ph);
            const card = el("rect", { x: bx, y: PY + 174, width: bw, height: 40, rx: 8, fill: "#fff", stroke: "#9ca3af", "stroke-width": 2 }, ph);
            const cardT = txt("CARD", { x: x + PW / 2, y: PY + 201, fill: "#111827" }, ph);
            const strike = el("line", { x1: bx + 6, y1: PY + 144, x2: bx + bw - 6, y2: PY + 144, stroke: "#dc2b4a", "stroke-width": 3, opacity: 0 }, ph);
            // outcome badge under the phone
            const ok = el("g", { opacity: 0 });
            el("circle", { cx: x + 22, cy: PY + PH + 26, r: 13, fill: "#0f9f6e" }, ok);
            el("path", { d: "M" + (x + 16) + " " + (PY + PH + 26) + "l4 4 8-8", fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, ok);
            txt(r.block ? "card" : "kept", { x: x + 42, y: PY + PH + 33, fill: "#065f46", "text-anchor": "start" }, ok);
            // hand-off token: laptop -> phone
            const tok = el("rect", { x: -9, y: -9, width: 18, height: 18, rx: 4, fill: col, opacity: 0 });

            tl.fromTo(ph, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3 + ti * 0.12);
            const lt = LOAD0 + ti * 0.5;
            tl.to("#va-t" + i, { opacity: 1, duration: 0.25 }, lt);
            tl.fromTo(tok, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.05 }, lt);
            tl.fromTo(tok, { x: P.x + 110, y: P.y + 10 }, { x: x + PW / 2, y: PY + 70, duration: 0.55, ease: "power2.inOut" }, lt);
            tl.to(tok, { attr: { opacity: 0 }, duration: 0.1 }, lt + 0.55);
            tl.to("#va-t" + i, { opacity: 0.45, duration: 0.4 }, lt + 0.9);
            // decision lands on the checkout
            const dt = DECIDE0 + ti * 0.6;
            if (r.block) {
              tl.to(cod, { attr: { fill: "#f3f4f6", stroke: "#d1d5db" }, duration: 0.3 }, dt);
              tl.to(codT, { attr: { fill: "#4b5563" }, duration: 0.3 }, dt);
              tl.fromTo(strike, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, dt + 0.1);
              tl.to(card, { attr: { fill: "#0e7490", stroke: "#0e7490" }, duration: 0.3 }, dt + 0.25);
              tl.to(cardT, { attr: { fill: "#ffffff" }, duration: 0.3 }, dt + 0.25);
            } else {
              tl.to(cod, { attr: { fill: "#b45309", stroke: "#b45309" }, duration: 0.3 }, dt);
              tl.to(codT, { attr: { fill: "#ffffff" }, duration: 0.3 }, dt);
            }
            tl.fromTo(ok, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.25 }, dt + 0.6);
          });
          svg.appendChild(document.getElementById("va-person"));

          // ---------------- choreography ----------------
          tl.fromTo("#va-page", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.7, ease: "power3.inOut" }, 0);
          tl.fromTo("#va-edge", { x: 0, opacity: 1 }, { x: 1920, duration: 0.7, ease: "power3.inOut" }, 0);
          tl.to("#va-edge", { opacity: 0, duration: 0.1 }, 0.7);
          tl.fromTo("#va-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.fromTo("#va-ttl", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#va-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo("#va-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
          tl.fromTo("#va-sheet", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          SHEET.rows.forEach((_, i) => tl.fromTo("#va-r" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.3 + i * 0.3));
          tl.fromTo("#va-more", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3 + SHEET.rows.length * 0.3);
          tl.fromTo("#va-totals", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);
          tl.fromTo(["#va-desk", "#va-lab-desk", "#va-floor", "#va-lab-floor"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
          tl.fromTo(["#va-person", "#va-laptop"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.fromTo("#va-meter", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, DECIDE0 - 0.4);
          const mv = { v: 0 }, mEl = document.getElementById("va-meter-v");
          tl.to(mv, { v: SHEET.day_true_gain, duration: 3.0, ease: "power2.out", onUpdate: () => { mEl.textContent = "+" + fmt(mv.v); } }, DECIDE0);
          tl.fromTo("#va-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.4);
          // text fades fully out before the wipe, so no two slides' text is ever on screen together
          tl.to(["#va-kick", "#va-ttl", "#va-ul", "#va-sub", "#va-sheet", "#va-lab-desk", "#va-desk", "#va-floor", "#va-lab-floor", "#va-svg", "#va-meter", "#va-caption"], { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 1.05);
          // wipe out (white -> dark), revealing the next dark scene underneath
          tl.to("#va-page", { clipPath: "inset(0px 0px 0px 100%)", duration: 0.7, ease: "power3.inOut" }, D - 0.7);
          tl.fromTo("#va-edge", { x: 0, opacity: 0 }, { x: 1920, opacity: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, D - 0.7);
          window.__timelines["value"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
